
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EduTechBridge</title>
</head>
<body>

    <header>
        <h1>EduTechBridge</h1>
        <p>ADTU Learning Hub</p>
    </header>

    <main>
        <h2>Welcome Back!</h2>
        <p>Log in to access your learning resources.</p>

        <form id="loginForm">

            <div>
                <label for="name">Full Name</label><br>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <br>

            <div>
                <label for="email">Email Address</label><br>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <br>

            <div>
                <label for="password">Password</label><br>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    minlength="6"
                >
            </div>

            <br>

            <div>
                <label for="role">Select Your Role</label><br>
                <select id="role" name="role" required>
                    <option value="">Choose your role</option>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>
            </div>

            <br>

            <button type="submit">Login</button>

        </form>

        <p>
            Don't have an account?
            <a href="#register">Register here</a>
        </p>

        <section id="register">
            <h3>New to EduTechBridge?</h3>
            <p>Registration will be implemented in a later stage.</p>
        </section>
    </main>

    <footer>
        <p>EduTechBridge - Learn, Share, Grow.</p>
    </footer>

</body>
</html>
